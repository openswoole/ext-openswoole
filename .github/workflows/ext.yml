name: ext-openswoole

on:
  push:
  pull_request:
  # Allow to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build-ubuntu-latest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
    - uses: actions/checkout@v6
    - name: install-deps
      run: sudo apt update -y && sudo apt install -y libcurl4-openssl-dev php-curl libc-ares-dev
    - name: phpize
      run: phpize
    - name: build1
      run: ./configure && make clean && make -j$(nproc)
    - name: build2
      run: ./configure --enable-sockets --enable-mysqlnd --enable-http2 --enable-hook-curl
        --enable-openssl --enable-cares --enable-debug-log &&
        make clean && make -j$(nproc)

  # build-centos:
  #   runs-on: ubuntu-latest
  #   if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
  #   container: 'centos:latest'
  #   steps:
  #   - uses: actions/checkout@v6
  #   - name: fix-repo
  #     run: sed -i 's/mirrorlist/#mirrorlist/g' /etc/yum.repos.d/CentOS-Linux-* && 
  #          sed -i 's|#baseurl=http://mirror.centos.org|baseurl=https://vault.centos.org|g' /etc/yum.repos.d/CentOS-Linux-*
  #   - name: install-deps
  #     run: yum update -y && yum install -y gcc gcc-c++ make c-ares-devel php-devel curl php-curl libcurl-devel openssl-devel postgresql-devel
  #   - name: phpize
  #     run: phpize
  #   - name: build
  #     run: ./configure --enable-sockets --enable-mysqlnd --enable-http2 --enable-hook-curl
  #       --enable-openssl --enable-cares --with-postgres --enable-debug-log &&
  #       make clean && make -j$(sysctl -n hw.ncpu)

  build-macos-latest:
    runs-on: macos-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    steps:
    - name: Install dependencies
      run: |
        brew install autoconf
        brew install shivammathur/php/php@8.3
        brew link --overwrite --force shivammathur/php/php@8.3
        brew install pcre2
        brew install c-ares
        ln -s /opt/homebrew/include/pcre2.h /opt/homebrew/opt/php@8.3/include/php/ext/pcre/pcre2.h
    - uses: actions/checkout@v6
    - name: phpize
      run: phpize
    - name: build1
      run: ./configure && make clean && make -j$(sysctl -n hw.ncpu)
    - name: build2
      run: |
        export CFLAGS="-I$(brew --prefix openssl)/include -I$(brew --prefix c-ares)/include $CFLAGS"
        export LDFLAGS="-L$(brew --prefix openssl)/lib -L$(brew --prefix c-ares)/lib $LDFLAGS"
        ./configure --enable-sockets --enable-mysqlnd --enable-http2 --enable-hook-curl --enable-openssl --with-openssl-dir=/opt/homebrew/opt/openssl@3 --enable-cares --enable-debug-log
        make clean && make -j$(sysctl -n hw.ncpu)

  build-freebsd:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v6
    - name: build and test on FreeBSD
      uses: vmactions/freebsd-vm@v1
      with:
        release: "14.3"
        usesh: true
        prepare: pkg install -y php84 php84-extensions php84-pcntl php84-posix php84-sockets php84-composer autoconf pkgconf
        run: |
          set -e
          phpize
          ./configure --enable-sockets --enable-http2
          make -j$(sysctl -n hw.ncpu)
          make install
          echo "extension=openswoole.so" > /usr/local/etc/php/ext-30-openswoole.ini
          php --ri openswoole | grep Version
          (cd tests/include/lib && composer install --no-interaction --no-progress --ignore-platform-reqs)
          # the FreeBSD 14.0 default, smaller than the 8192 of later releases
          sysctl net.local.dgram.maxdgram=2048
          TEST_PHP_EXECUTABLE=$(which php) PHPT=1 php tests/run-tests --show-diff tests/openswoole_server/process_mode_large_ipc.phpt

  build-alpine-latest:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.event.pull_request.base.repo.full_name
    strategy:
      matrix:
        php-version: [ '8.3.15']
        alpine-version: [ '3.20' ]
        include:
          - php-version: '8.4.2'
            alpine-version: '3.21'
          - php-version: '8.5.0'
            alpine-version: '3.23'
          - php-version: '8.6'
            alpine-version: '3.24'
            image-php: 1
      max-parallel: 8
      fail-fast: false
    steps:
      - uses: actions/checkout@v6
      - name: build
        run: |
          cp .github/workflows/alpine.Dockerfile alpine.Dockerfile
          docker build -t openswoole . -f alpine.Dockerfile --build-arg PHP_VERSION=${{ matrix.php-version }} --build-arg ALPINE_VERSION=${{ matrix.alpine-version }} --build-arg IMAGE_PHP=${{ matrix.image-php || 0 }}
